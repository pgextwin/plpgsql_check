name: Issue 75 Windows standard runner budget smoke (non-signing)

# Separate one-shot smoke for runner eligibility under the existing $0 Actions budget.
# Do not use this workflow to authorize a Release or the GO A signed canary.
on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Full 40-character SHA of the protected main branch at dispatch
        required: true
        type: string

concurrency:
  group: issue-75-windows-standard-runner-smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows_standard_runner:
    name: Windows hosted runner start proof (no artifacts or attestation)
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'pgextwin/plpgsql_check' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.actor == 'ShutenOishi' && github.triggering_actor == 'ShutenOishi' }}
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Fail-closed immutable main, operator and Windows runner preflight
        shell: pwsh
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          ACTUAL_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUNNER_OPERATING_SYSTEM: ${{ runner.os }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EXPECTED_MAIN_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'DENY: invalid full-SHA input' }
          if ($env:ACTUAL_SHA -cne $env:EXPECTED_MAIN_SHA) { throw 'DENY: changed protected main SHA' }
          if ($env:REPO -cne 'pgextwin/plpgsql_check' -or
              $env:REF -cne 'refs/heads/main' -or
              $env:EVENT -cne 'workflow_dispatch' -or
              $env:ACTOR -cne 'ShutenOishi' -or
              $env:TRIGGERING_ACTOR -cne 'ShutenOishi' -or
              $env:RUN_ATTEMPT -cne '1') { throw 'DENY: unexpected manual-run identity' }
          if ($env:RUNNER_OPERATING_SYSTEM -cne 'Windows' -or
              $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or
              $env:RUNNER_OS -cne 'Windows' -or
              -not [System.Runtime.InteropServices.RuntimeInformation]::IsOSPlatform(
                [System.Runtime.InteropServices.OSPlatform]::Windows)) {
            throw 'DENY: runner is not GitHub-hosted Windows'
          }
          Write-Host 'PASS: protected-main, SHA, actor, first-attempt and Windows hosted runner'
          Write-Host "Repository=$env:REPO; ref=$env:REF; sha=$env:ACTUAL_SHA"
          Write-Host "RunnerOS=$env:RUNNER_OPERATING_SYSTEM; runnerEnvironment=$env:RUNNER_ENVIRONMENT"
          Write-Host "OSDescription=$([System.Runtime.InteropServices.RuntimeInformation]::OSDescription)"
          Write-Host 'No checkout, upload, attestation, publisher or Release operation was performed.'
