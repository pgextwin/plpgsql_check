name: Issue 75 GO A non-Release genuine signed canary (one-shot)

# Never a publication or Publisher rehearsal.
on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact protected main SHA after the canary PR merge
        required: true
        type: string

concurrency:
  group: issue-75-go-a-one-shot-signed-canary
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Fail-closed dispatch, main, lifecycle and one-shot guard
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'pgextwin/plpgsql_check' && github.ref == 'refs/heads/main' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pgextwin/build
          ref: 5756b3c5136a8bf4db710016cfe97555f0a71c6d
          path: .pgextwin-build-go-a
          persist-credentials: false
      - name: Authenticated immutable dispatch and maintained PG guard
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_main_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RUN_SHA"
          test "$(git -C .pgextwin-build-go-a rev-parse HEAD)" = '5756b3c5136a8bf4db710016cfe97555f0a71c6d'
          python3 scripts/issue_75_go_a_canary_verify.py preflight \
            --expected-sha "$EXPECTED_SHA" --run-id "$RUN_ID" --attempt "$RUN_ATTEMPT" \
            --lifecycle .pgextwin-build-go-a/metadata/postgresql.json

  sign:
    name: Immutable reusable signer (PG14-18, no Release)
    needs: preflight
    if: ${{ needs.preflight.result == 'success' }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: pgextwin/build/.github/workflows/build-extension-attested.yml@5756b3c5136a8bf4db710016cfe97555f0a71c6d
    with:
      extension_config_path: config/extension.json
      test_contract_path: config/test-contract.json

  verify:
    name: Independent read-only real X.509 and ZIP/SPDX proof
    needs: [preflight, sign]
    if: ${{ needs.preflight.result == 'success' && needs.sign.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pgextwin/build
          ref: 5756b3c5136a8bf4db710016cfe97555f0a71c6d
          path: .pgextwin-build-go-a
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: plpgsql_check-pg*-windows-x64
          path: ${{ runner.temp }}/go-a-dist
          merge-multiple: true
      - name: Re-fetch trust boundary and verify all ten genuine certificates
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_main_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RUN_SHA"
          test "$(git -C .pgextwin-build-go-a rev-parse HEAD)" = '5756b3c5136a8bf4db710016cfe97555f0a71c6d'
          python3 scripts/issue_75_go_a_canary_verify.py verify \
            --expected-sha "$EXPECTED_SHA" --run-id "$RUN_ID" --attempt "$RUN_ATTEMPT" \
            --lifecycle .pgextwin-build-go-a/metadata/postgresql.json \
            --dist "$RUNNER_TEMP/go-a-dist" --trusted-build .pgextwin-build-go-a
