name: Validate Step 19 PowerShell hooks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Parse every Windows hook with PowerShell
        shell: pwsh
        run: |
          foreach ($script in @('windows/ci/build.ps1','windows/ci/package.ps1','windows/ci/install.ps1','windows/ci/smoke-test.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script).Path, [ref]$tokens, [ref]$errors)
            foreach ($parseError in @($errors)) {
              Write-Host "PARSE_ERROR $script LINE $($parseError.Extent.StartLineNumber) COLUMN $($parseError.Extent.StartColumnNumber) : $($parseError.Message)"
            }
            if (@($errors).Count -gt 0) { throw "PowerShell parser rejected $script" }
          }
          Write-Host 'All Windows PowerShell hooks parsed successfully.'
      - name: Deny unsafe changes to main-only Classic protection audit (#75)
        run: python3 tests/test_classic_protection_audit_workflow.py
      - name: Deny unsafe Phase D real GitHub expected-denial workflow changes (#75)
        run: python3 tests/test_phase_d_live_deny_workflow.py
      - name: Deny unauthorized update-watch event, actor, permission or pin drift (B1)
        run: python3 tests/test_on_demand_update_workflow.py
      - name: Validate existing-run SAN URI and deny forged recovery evidence (#75)
        run: |
          python3 tests/test_promotion_workflow.py
          python3 tests/test_issue_75_go_a_readonly_recovery.py
