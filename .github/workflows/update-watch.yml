name: Upstream update watch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-watch.yml
  schedule:
    # Daily at 09:00 JST (00:00 UTC; GitHub Actions cron uses UTC).
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Detect updates without modifying Issues
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

jobs:
  watch:
    permissions:
      contents: read
      issues: write
    uses: pgextwin/build/.github/workflows/check-extension-updates.yml@16b886b9d06d6f389b369b87ce0c155767697ca0
    with:
      extension_config_path: config/extension.json
      update_watch_path: config/update-watch.json
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

  candidate:
    name: Detect, prepare, and dispatch new stable Windows candidate
    needs: watch
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: pgextwin/build/.github/workflows/candidate-update.yml@16b886b9d06d6f389b369b87ce0c155767697ca0
    with:
      extension_config_path: config/extension.json
      update_watch_path: config/update-watch.json
      candidate_policy_path: config/candidate-build.json
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
