name: Windows CI/CD

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

# Never cancel a partially completed release build/publication run.
concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows:
    if: ${{ !startsWith(github.ref, 'refs/heads/release/') }}
    permissions:
      contents: read
    uses: pgextwin/build/.github/workflows/build-extension.yml@21c99b933da98f397f739971e738ecb685fe55d2
    with:
      extension_config_path: config/extension.json
      test_contract_path: config/test-contract.json

  release_preflight:
    if: ${{ startsWith(github.ref, 'refs/heads/release/') }}
    name: Reject existing release and tag before attested build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Confirm this publication is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-release-absence.sh

  release_build:
    if: ${{ startsWith(github.ref, 'refs/heads/release/') }}
    needs: release_preflight
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: pgextwin/build/.github/workflows/build-extension-attested.yml@2c6cd6a5b122f0ba1870e9d70cb84cc949bd281d
    with:
      extension_config_path: config/extension.json
      test_contract_path: config/test-contract.json

  release_final_preflight:
    name: Recheck release and tag before publication
    needs: release_build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Confirm release/tag remain unused
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-release-absence.sh

  release:
    if: ${{ startsWith(github.ref, 'refs/heads/release/') }}
    needs: [release_build, release_final_preflight]
    permissions:
      contents: write
    uses: pgextwin/build/.github/workflows/release-extension.yml@9945fff768e6e388401d725bee7a4d113ea3e00d
    with:
      extension_name: ${{ needs.release_build.outputs.extension_name }}
      upstream_repository: ${{ needs.release_build.outputs.upstream_repository }}

  candidate_report:
    name: Verify PG-major candidate artifacts and annotate owned PR
    if: ${{ always() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/auto-candidate/') }}
    needs: windows
    permissions:
      contents: read
      actions: read
      issues: write
    uses: pgextwin/build/.github/workflows/verify-candidate.yml@21c99b933da98f397f739971e738ecb685fe55d2
    with:
      matrix_result: ${{ needs.windows.result }}

  release_gate_tests:
    name: Regression-test immutable Release preflight
    if: ${{ !startsWith(github.ref, 'refs/heads/release/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify PowerShell build/package hooks parse cleanly
        shell: pwsh
        run: |
          foreach ($script in @('windows/ci/build.ps1','windows/ci/package.ps1','windows/ci/install.ps1','windows/ci/smoke-test.ps1')) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script).Path, [ref]$tokens, [ref]$errors)
            if (@($errors).Count -gt 0) { throw "PowerShell syntax error in $script : $($errors | Out-String)" }
          }
          Write-Host 'All plpgsql_check Windows hook scripts parsed successfully.'

      - name: Run release gate fixture tests
        run: python3 tests/test_release_gate.py
