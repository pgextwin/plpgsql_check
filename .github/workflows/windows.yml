name: Windows CI/CD

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

# Never cancel a partially completed release build/publication run.
concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows:
    if: ${{ !startsWith(github.ref, 'refs/heads/release/') }}
    permissions:
      contents: read
    uses: pgextwin/build/.github/workflows/build-extension.yml@2c6cd6a5b122f0ba1870e9d70cb84cc949bd281d
    with:
      extension_config_path: config/extension.json
      test_contract_path: config/test-contract.json

  release_preflight:
    if: ${{ startsWith(github.ref, 'refs/heads/release/') }}
    name: Reject existing release and tag before attested build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Confirm this publication is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-release-absence.sh

  release_build:
    if: ${{ startsWith(github.ref, 'refs/heads/release/') }}
    needs: release_preflight
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: pgextwin/build/.github/workflows/build-extension-attested.yml@2c6cd6a5b122f0ba1870e9d70cb84cc949bd281d
    with:
      extension_config_path: config/extension.json
      test_contract_path: config/test-contract.json

  release_final_preflight:
    name: Recheck release and tag before publication
    needs: release_build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Confirm release/tag remain unused
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-release-absence.sh

  release:
    if: ${{ startsWith(github.ref, 'refs/heads/release/') }}
    needs: [release_build, release_final_preflight]
    permissions:
      contents: write
    uses: pgextwin/build/.github/workflows/release-extension.yml@2c6cd6a5b122f0ba1870e9d70cb84cc949bd281d
    with:
      extension_name: ${{ needs.release_build.outputs.extension_name }}
      upstream_repository: ${{ needs.release_build.outputs.upstream_repository }}

  candidate_report:
    name: Candidate matrix verification and PR evidence
    if: always() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/auto-candidate/')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Require every maintained PG-major artifact and annotate candidate PR
        env:
          GH_TOKEN: ${{ github.token }}
          MATRIX_RESULT: ${{ needs.windows.result }}
        shell: bash
        run: |
          set -euo pipefail
          branch="$GITHUB_REF_NAME"
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" \
            --state open --json number --jq '.[0].number')"
          if [[ ! "$pr" =~ ^[0-9]+$ ]]; then
            echo "::error::Missing open candidate PR"
            exit 1
          fi
          ok=true
          if [ "$MATRIX_RESULT" != "success" ]; then
            ok=false
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[].name' > "$RUNNER_TEMP/artifact-names.txt"
          for major in 15 16 17 18; do
            if ! grep -Fxq "plpgsql_check-pg$major-windows-x64" "$RUNNER_TEMP/artifact-names.txt"; then
              echo "::error::Missing candidate artifact for PG$major"
              ok=false
            fi
          done
          if [ "$ok" = true ]; then
            status="VERIFIED CANDIDATE (PG15-18)"
          else
            status="FAILED / INCOMPLETE CANDIDATE"
          fi
          cat > "$RUNNER_TEMP/candidate-comment.md" <<EOF
          <!-- pgextwin-candidate-run:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT -->
          ## $status

          - Read-only Windows CI run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - Matrix result: $MATRIX_RESULT
          - Expected PG major artifacts: PG15, PG16, PG17, PG18
          - Evidence: each per-major Actions artifact must contain ZIP, SPDX SBOM and Grype report after successful shared packaging steps.
          - Candidate CI has **no Release publication, provenance attestation, or Catalog/Website update**.
          - A later attested Release must be built from a reviewed commit after independent source/export audit.
          EOF
          gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/candidate-comment.md"
          if [ "$ok" != true ]; then exit 1; fi

  release_gate_tests:
    name: Regression-test immutable Release preflight
    if: {{ !startsWith(github.ref, 'refs/heads/release/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run release gate fixture tests
        run: python3 tests/test_release_gate.py
