name: Windows CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Never cancel a partially completed release build/publication run.
concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows:
    if: ${{ !startsWith(github.ref, 'refs/heads/release/') }}
    permissions:
      contents: read
    uses: pgextwin/build/.github/workflows/build-extension.yml@4adc71076283dc9cf64543b760c65b054f5a85f0
    with:
      extension_config_path: config/extension.json
      test_contract_path: config/test-contract.json

  # Stable branch-protection context independent of PG14/PG19 matrix churn.
  # This result requires the ENTIRE maintained-major reusable Windows build.
  # No Release/dispatch/publish operations occur in this job.
  windows_required:
    name: Windows required summary
    if: ${{ always() && !startsWith(github.ref, 'refs/heads/release/') }}
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test required Windows aggregate allow/deny contract
        run: python3 tests/test_required_windows_summary.py
      - name: Require full maintained-PG Windows matrix success
        env:
          WINDOWS_MATRIX_RESULT: ${{ needs.windows.result }}
        run: python3 scripts/required_windows_summary.py

  # Step 21: release/* publishing path is intentionally retired for plpgsql_check.
  # Only an approved manual main promotion can create a future release.

  candidate_report:
    name: Verify PG-major candidate artifacts and annotate owned PR
    if: ${{ always() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/auto-candidate/') }}
    needs: windows
    permissions:
      contents: read
      actions: read
      issues: write
    uses: pgextwin/build/.github/workflows/verify-candidate.yml@ecf84241c1c4cd99fab3f964cb309f9c6e2a01f8
    with:
      matrix_result: ${{ needs.windows.result }}

  release_gate_tests:
    name: Regression-test immutable Release preflight
    if: ${{ !startsWith(github.ref, 'refs/heads/release/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify PowerShell build/package hooks parse cleanly
        shell: pwsh
        run: |
          foreach ($script in @('windows/ci/build.ps1','windows/ci/package.ps1','windows/ci/install.ps1','windows/ci/smoke-test.ps1')) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script).Path, [ref]$tokens, [ref]$errors)
            if (@($errors).Count -gt 0) { throw "PowerShell syntax error in $script : $($errors | Out-String)" }
          }
          Write-Host 'All plpgsql_check Windows hook scripts parsed successfully.'

      - name: Run release gate fixture tests
        run: |
          python3 tests/test_release_gate.py
          python3 tests/test_source_export_binding.py
          python3 tests/test_promotion_workflow.py
          python3 tests/test_pg14_backfill.py
          python3 tests/test_on_demand_update_workflow.py
