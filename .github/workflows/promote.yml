name: Promote verified upstream candidate to attested Release

on:
  workflow_dispatch:
    inputs:
      candidate_pr:
        description: Merged automation-owned candidate PR number
        required: true
        type: string
      candidate_run_id:
        description: Successful Windows candidate matrix workflow run ID
        required: true
        type: string
      decision_run_id:
        description: Upstream watch run containing candidate-decision artifact
        required: true
        type: string
      confirm_release:
        description: Type PUBLISH to explicitly authorize this exact manual Release
        required: true
        type: string
      release_tag:
        description: New never-used vX.Y.Z-windows.N Release tag
        required: true
        type: string

# One promotion operation at a time: tag reservation also atomically rejects duplicates.
concurrency:
  group: plpgsql_check-release-promotion
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    name: Invoke shared exact-SHA manual signed promotion
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      actions: read
      pull-requests: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: pgextwin/build/.github/workflows/promote-verified-release.yml@5425225ea858f8c0165421902c3e66c6c9205f60
    with:
      candidate_pr: ${{ inputs.candidate_pr }}
      candidate_run_id: ${{ inputs.candidate_run_id }}
      decision_run_id: ${{ inputs.decision_run_id }}
      release_tag: ${{ inputs.release_tag }}
      confirm_release: ${{ inputs.confirm_release }}
    secrets:
      catalog_app_private_key: ${{ secrets.PGEXTWIN_CATALOG_APP_PRIVATE_KEY }}
