name: Promote verified upstream candidate to attested Release

on:
  workflow_dispatch:
    inputs:
      candidate_pr:
        description: Merged automation-owned candidate PR number
        required: true
        type: string
      candidate_run_id:
        description: Successful Windows candidate matrix workflow run ID
        required: true
        type: string
      decision_run_id:
        description: Upstream watch run containing candidate-decision artifact
        required: true
        type: string
      approval_pr:
        description: Separately reviewed/merged approval JSON PR number
        required: true
        type: string
      release_tag:
        description: New never-used vX.Y.Z-windows.N Release tag
        required: true
        type: string

# One promotion operation at a time: tag reservation also atomically rejects duplicates.
concurrency:
  group: plpgsql_check-release-promotion
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  authorize:
    name: Verify signed-off candidate and manual approval
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pgextwin/build
          ref: 4d77eac5585a3e5f87fc0a8ebacfc9e2c3332b79
          path: .pgextwin-build
          persist-credentials: false
      - name: Verify candidate decision/audit, human-reviewed main and policy
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CANDIDATE_PR: ${{ inputs.candidate_pr }}
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
          DECISION_RUN: ${{ inputs.decision_run_id }}
          APPROVAL_PR: ${{ inputs.approval_pr }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python .pgextwin-build/scripts/promotion-gate.py \
            --candidate-pr "$CANDIDATE_PR" \
            --candidate-run-id "$CANDIDATE_RUN" \
            --decision-run-id "$DECISION_RUN" \
            --approval-pr "$APPROVAL_PR" \
            --release-tag "$RELEASE_TAG" \
            --extension config/extension.json \
            --local-policy config/release-promotion.json \
            --lifecycle .pgextwin-build/metadata/postgresql.json \
            --output "$RUNNER_TEMP/promotion-receipt.json"
      - name: Save immutable authorization receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion-receipt
          path: ${{ runner.temp }}/promotion-receipt.json
          if-no-files-found: error

  release_build:
    name: Fresh attested Windows PG15-18 build from reviewed main
    needs: authorize
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: pgextwin/build/.github/workflows/build-extension-attested.yml@2c6cd6a5b122f0ba1870e9d70cb84cc949bd281d
    with:
      extension_config_path: config/extension.json
      test_contract_path: config/test-contract.json

  publish:
    name: Verify signatures and SHA; create-only formal publication
    needs: [authorize, release_build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pgextwin/build
          ref: 4d77eac5585a3e5f87fc0a8ebacfc9e2c3332b79
          path: .pgextwin-build
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: promotion-receipt
          path: ${{ runner.temp }}/authorization
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: plpgsql_check-pg*-windows-x64
          path: dist
          merge-multiple: true
      - name: Verify actual signed build and create-only release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python .pgextwin-build/scripts/publish-release.py \
            --manifest config/extension.json \
            --receipt "$RUNNER_TEMP/authorization/promotion-receipt.json" \
            --tag "$RELEASE_TAG" \
            --dist dist \
            --recovery "$RUNNER_TEMP/promotion-recovery.json"
      - name: Preserve recovery state without deleting existing tags or drafts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion-recovery
          path: ${{ runner.temp }}/promotion-recovery.json
          if-no-files-found: warn
