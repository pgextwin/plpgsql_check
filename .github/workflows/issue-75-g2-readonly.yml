name: Issue 75 G2 genuine GET-only JIT negative snapshots (no publication)

# One-shot protected-main/path-only audit. PR code never receives credentials.
# GraphQL POST is exclusively a read-only query transport, NEVER mutation.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/issue-75-g2-readonly.yml

permissions:
  contents: read

concurrency:
  group: issue-75-g2-get-only-protected-main
  cancel-in-progress: false

jobs:
  g2_real_negative:
    name: G2 independent double-read DENY (protected main only)
    if: ${{ github.event_name == 'push' && github.repository == 'pgextwin/plpgsql_check' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
      attestations: read
    steps:
      - name: Reject unexpected App, actor, event, attempt or SHA before any secret use
        shell: bash
        env:
          AUDITOR_APP_ID: ${{ vars.PGEXTWIN_PROTECTION_AUDITOR_APP_ID }}
          AUDITOR_CLIENT_ID: ${{ vars.PGEXTWIN_PROTECTION_AUDITOR_CLIENT_ID }}
          AUDITOR_INSTALLATION_ID: ${{ vars.PGEXTWIN_PROTECTION_AUDITOR_INSTALLATION_ID }}
          RUN_ACTOR: ${{ github.actor }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$AUDITOR_APP_ID" != "5295410" ||
                "$AUDITOR_CLIENT_ID" != "Iv23lidY1vsm7ZseyKe2" ||
                "$AUDITOR_INSTALLATION_ID" != "170837728" ||
                "$RUN_ACTOR" != "ShutenOishi" ||
                "$RUN_ATTEMPT" != "1" ||
                ! "$RUN_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'DENY: untrusted G2 protected-main context; publishableReceipt=false; mutationsEnabled=false'
            exit 1
          fi
          echo 'PASS: G2 immutable main/event/actor/App preflight; publishableReceipt=false'

      - name: Checkout protected merged build verifier at exact immutable SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pgextwin/build
          ref: 7449b7766f180035248d76951327b6be2c0a86ca
          path: trusted-build
          fetch-depth: 1
          persist-credentials: false

      - name: Reject unexpected trusted-build revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C trusted-build rev-parse HEAD)" == "7449b7766f180035248d76951327b6be2c0a86ca" ]] ||
            { echo 'DENY: trusted code SHA mismatch; publishableReceipt=false'; exit 1; }

      - name: Mint existing single-repo Administration READ-only App token
        id: auditor
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.PGEXTWIN_PROTECTION_AUDITOR_APP_ID }}
          private-key: ${{ secrets.PGEXTWIN_PROTECTION_AUDITOR_PRIVATE_KEY }}
          owner: pgextwin
          repositories: plpgsql_check
          permission-administration: read
          permission-metadata: read
          skip-token-revoke: false

      - name: Require exact auditor installation and App identity
        shell: bash
        env:
          MINTED_INSTALLATION_ID: ${{ steps.auditor.outputs.installation-id }}
          MINTED_APP_SLUG: ${{ steps.auditor.outputs.app-slug }}
        run: |
          set -euo pipefail
          if [[ "$MINTED_INSTALLATION_ID" != "170837728" ||
                "$MINTED_APP_SLUG" != "pgextwin-classic-protection-audit" ]]; then
            echo 'DENY: unexpected auditor identity; publishableReceipt=false; mutationsEnabled=false'
            exit 1
          fi

      - name: Verify TWO independent authenticated negative JIT rounds
        shell: bash
        env:
          EVIDENCE_TOKEN: ${{ github.token }}
          ADMIN_TOKEN: ${{ steps.auditor.outputs.token }}
          GH_PROMPT_DISABLED: '1'
        run: |
          set -euo pipefail
          python3 trusted-build/scripts/chat-pr-g2-live-negative.py

      - name: Confirm no publication authority was emitted
        if: ${{ success() }}
        run: echo 'DRY_RUN_G2_NEGATIVE_ONLY; publishableReceipt=false; mutationsEnabled=false; G3/G4/G5 not enabled'
